<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you go on a date with me?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            overflow: hidden;
            touch-action: manipulation;
        }
        /* Floating Lines/Glows Animation */
        .glow-line { position: absolute; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent); height: 4px; border-radius: 10px; filter: blur(2px); animation: floatLine 6s infinite ease-in-out; pointer-events: none; z-index: 0; }
        @keyframes floatLine { 0% { transform: translateY(100vh) translateX(-50px) rotate(-45deg) scaleX(0.5); opacity: 0; } 50% { opacity: 0.6; } 100% { transform: translateY(-20vh) translateX(50px) rotate(-45deg) scaleX(1.5); opacity: 0; } }
        /* Floating Hearts Animation */
        .heart { position: absolute; bottom: -50px; font-size: 24px; animation: floatUp 5s linear forwards; opacity: 0.7; pointer-events: none; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 0.7; } 100% { transform: translateY(-110vh) scale(1.5); opacity: 0; } }
        /* Confetti Animation */
        .confetti { position: absolute; width: 10px; height: 10px; background-color: #f00; animation: fall 3s ease-in-out forwards; pointer-events: none; }
        @keyframes fall { 0% { transform: translateY(-100px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
        /* Tiny Tap Hearts */
        .tiny-heart { position: absolute; font-size: 24px; animation: floatFade 1s ease-out forwards; pointer-events: none; z-index: 50; }
        @keyframes floatFade { 0% { transform: translateY(0) scale(0.5); opacity: 1; } 100% { transform: translateY(-60px) scale(1.5); opacity: 0; } }
        /* Smooth transition for the NO button */
        #noBtn { transition: left 0.2s ease, top 0.2s ease; }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center relative">
    <div id="bgContainer" class="absolute inset-0 pointer-events-none z-0 overflow-hidden"></div>
    <div id="mainCard" class="bg-white/80 backdrop-blur-md p-8 sm:p-12 rounded-3xl shadow-2xl text-center z-10 max-w-sm w-[90%] border border-white/50 transform transition-all duration-500">
        <div class="mb-6 h-48 flex items-center justify-center">
            <img id="mainGif" src="bubu-dudu.webp" alt="Cute begging bear" class="w-full h-full object-contain rounded-xl">
        </div>
        <h1 id="questionText" class="text-3xl sm:text-4xl font-extrabold text-pink-600 mb-8 drop-shadow-sm">
            Will you go on a date with me? 🥰
        </h1>
        <div id="buttonContainer" class="relative flex justify-center items-center gap-4 h-20 w-full mt-4">
            <button id="yesBtn" class="bg-pink-500 hover:bg-pink-600 text-white text-2xl font-bold py-4 px-10 rounded-full shadow-lg transform transition hover:scale-110 z-20">
                YES!
            </button>
            <button id="noBtn" class="bg-gray-200 text-gray-600 text-2xl font-bold py-4 px-10 rounded-full shadow hover:bg-gray-300 z-20 cursor-not-allowed">
                No
            </button>
        </div>
    </div>
    <div id="successCard" class="hidden bg-white/90 backdrop-blur-md p-8 sm:p-12 rounded-3xl shadow-2xl text-center z-20 max-w-sm w-[90%] border border-white/50 flex-col items-center">
       <div class="mb-6 h-48 flex items-center justify-center">
            <img id="mainGif1" src="pro.gif" alt="Cute begging bear" class="w-full h-full object-contain rounded-xl">
        </div>
     
        <h1 class="text-3xl sm:text-4xl font-extrabold text-pink-600 mb-4">Yay! 🎉</h1>
         <p class="text-gray-800 text-xl font-bold">We don't need to figure out the whole future right now—let's just focus on having fun today! 🥰
<br>Yay! <br> Message me when you are free and let's plan our date!</p>    
    </div>
    
    <img id="bottomLeftGif" src="bubu-dudu-bubu.gif" alt="Happy Bear Left" class="hidden fixed bottom-4 left-4 w-32 h-32 object-contain z-30">
    <img id="bottomRightGif" src="bubu-happy.gif" alt="Happy Bear Right" class="hidden fixed bottom-4 right-4 w-32 h-32 object-contain z-30">
    
    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainCard = document.getElementById('mainCard');
        const successCard = document.getElementById('successCard');
        const bgContainer = document.getElementById('bgContainer');
        const bottomLeftGif = document.getElementById('bottomLeftGif');
        const bottomRightGif = document.getElementById('bottomRightGif');

        function moveNoButton() {
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const maxX = viewportWidth - btnWidth - 20; 
            const maxY = viewportHeight - btnHeight - 20;
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            noBtn.style.position = 'fixed'; 
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoButton(); });
        
        yesBtn.addEventListener('click', () => {
            mainCard.classList.add('hidden');
            successCard.classList.remove('hidden');
            successCard.classList.add('flex');
            bottomLeftGif.classList.remove('hidden');
            bottomRightGif.classList.remove('hidden');
            triggerConfetti();
        });

        setInterval(() => {
            if(Math.random() > 0.5) {
                const line = document.createElement('div');
                line.classList.add('glow-line');
                line.style.left = Math.random() * 100 + 'vw';
                line.style.width = (Math.random() * 150 + 50) + 'px';
                line.style.animationDuration = (Math.random() * 4 + 4) + 's';
                bgContainer.appendChild(line);
                setTimeout(() => line.remove(), 8000);
            }
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.transform = `scale(${Math.random() * 0.5 + 0.8})`;
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            bgContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }, 400);

        function triggerConfetti() {
            const colors = ['#ff0000', '#ff69b4', '#ffc0cb', '#ffd700', '#00ff00', '#00ffff'];
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                if (Math.random() > 0.5) { confetti.style.borderRadius = '50%'; }
                document.body.appendChild(confetti);
                setTimeout(() => { confetti.remove(); }, 5000);
            }
        }

        function createTinyHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('tiny-heart');
            heart.innerHTML = '💖';
            heart.style.left = `${x - 12}px`; 
            heart.style.top = `${y - 12}px`;
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 1000);
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('button')) return; 
            createTinyHeart(e.clientX, e.clientY);
        });

        document.addEventListener('touchstart', (e) => {
            if (e.target.closest('button')) return; 
            const touch = e.touches[0];
            createTinyHeart(touch.clientX, touch.clientY);
        }, { passive: true });
    </script>
</body>
</html>
